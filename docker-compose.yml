version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - RUN_MIGRATIONS=1
    depends_on:
      - redis
      - grpc-server
    volumes:
      - .:/app

  worker:
    build: .
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - redis
      - grpc-server
    volumes:
      - .:/app

  grpc-server:
    build: .
    command: python -m main.grpc_server
    env_file:
      - .env
    ports:
      - "50051:50051"
    depends_on:
      - redis
    volumes:
      - .:/app
